name: Telgani
description: Telgani is an app-based car rental aggregator founded in 2018 and headquartered
  in Riyadh, Saudi Arabia. Its consumer iOS and Android apps let users compare prices and
  book cars from more than 50 partner rental companies with over 500 branches across the
  Kingdom, offering doorstep delivery, airport pickup, and daily, monthly, or yearly rentals.
  Backed by 500 Global, Impact46, and Elm, Telgani has raised roughly $8.5M across a seed
  round, a 2021 pre-Series A, and a 2023 Series A. Telgani operates as a consumer mobile
  marketplace and does not publish a public developer API program; this profile captures its
  public web properties (homepage, privacy policy, terms of service) and its domain security
  posture.
